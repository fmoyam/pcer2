server:
  port: 8080

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: # CORREGIDO: Raíz directa correcta para Spring Cloud Gateway
        - id: service-clientes
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/clientes/**
          filters:
            - AuthenticationFilter

        - id: service-equipo
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/equipos/**
          filters:
            - AuthenticationFilter

        - id: service-servicio
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/servicios/**
          filters:
            - AuthenticationFilter

        - id: service-orden
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/ordenes/**
          filters:
            - AuthenticationFilter

        - id: service-voucher
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/vouchers/**
          filters:
            - AuthenticationFilter

        - id: service-estadisticas
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/estadisticas/**
          filters:
            - AuthenticationFilter

        - id: service-hardware
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/hardware/**
          filters:
            - AuthenticationFilter

        - id: service-software
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/software/**
          filters:
            - AuthenticationFilter

        - id: service-mantenimiento
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/mantenimiento/**
          filters:
            - AuthenticationFilter
            
        - id: service-descuento
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/descuento/**
          filters:
            - AuthenticationFilter

        # La ruta de autenticación queda limpia SIN filtros para poder iniciar sesión libremente
        - id: service-auth
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    register-with-eureka: false # Corregido typo "wiht"
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Clientes
        url: /api/v1/clientes/v3/api-docs

      - name: Equipos
        url: /api/v1/equipos/v3/api-docs

      - name: Servicio Técnico
        url: /api/v1/servicios/v3/api-docs

      - name: Órdenes de Trabajo
        url: /api/v1/ordenes/v3/api-docs

      - name: Voucher
        url: /api/v1/vouchers/v3/api-docs

      - name: Estadísticas
        url: /api/v1/estadisticas/v3/api-docs

      - name: Hardware
        url: /api/v1/hardware/v3/api-docs

      - name: Software
        url: /api/v1/software/v3/api-docs

      - name: Mantenimiento
        url: /api/v1/mantenimiento/v3/api-docs

      - name: Descuento
        url: /api/v1/descuento/v3/api-docs

      - name: Auth
        url: /api/v1/auth/v3/api-docs

logging:
  level: 
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG